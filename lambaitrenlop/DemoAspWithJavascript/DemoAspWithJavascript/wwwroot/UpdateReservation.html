<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Update Reservation</title>
    <link href="lib/bootstrap/dist/css/bootstrap.css" rel="stylesheet" />
    <script src="lib/jquery/dist/jquery.js"></script>
</head>
<body>
    <div class="container-fluid">
        <h2>Update a Reservation <a href="AllReservation.html" class="btn btn-sm btn-secondary">Back</a></h2>
        <div class="form-group">
            <label for="Id">Id:</label>
            <input type="text" class="form-control" id="Id" readonly />
        </div>
        <div class="form-group">
            <label for="Name">Name:</label>
            <input type="text" class="form-control" id="Name" />
        </div>
        <div class="form-group">
            <label for="StartLocation">Start Location:</label>
            <input type="text" class="form-control" id="StartLocation" />
        </div>
        <div class="form-group">
            <label for="EndLocation">End Location:</label>
            <input type="text" class="form-control" id="EndLocation" />
        </div>
        <div class="text-center panel-body">
            <button type="submit" class="btn btn-sm btn-primary" id="UpdateButton">Update</button>
        </div>
        <div id="resultDiv" style="display:none">
            <h2>Reservation</h2>
            <table class="table table-sm table-striped table-bordered m-2">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Start Location</th>
                        <th>End Location</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script type="text/javascript">
        $(document).ready(function () {
            GetReservation();

            $("#UpdateButton").click(function (e) {
                var formData = new FormData();
                formData.append("Id", $("#Id").val());
                formData.append("Name", $("#Name").val());
                formData.append("StartLocation", $("#StartLocation").val());
                formData.append("EndLocation", $("#EndLocation").val());

                $.ajax({
                    url: "http://localhost:8871/api/Reservation",
                    type: "put",
                    processData: false,
                    contentType: false,
                    data: formData,
                    success: function (result, status, xhr) {
                        var str = "<tr><td>" + result["id"] + "</td><td>" + result["name"] + "</td><td>" +
                            result["startLocation"] + "</td><td>" + result["endLocation"] + "</td></tr>";
                        $("table tbody").html(str);
                        $("#resultDiv").show();
                    },
                    error: function (xhr, status, error) {
                        console.log(xhr);
                    }
                });
            });
        });

        function GetReservation() {
            var id = new URLSearchParams(window.location.search).get("id");
            $.ajax({
                url: "http://localhost:8871/api/Reservation/" + id,
                type: "get",
                contentType: "application/json",
                success: function (result, status, xhr) {
                    $("#Id").val(result["id"]);
                    $("#Name").val(result["name"]);
                    $("#StartLocation").val(result["startLocation"]);
                    $("#EndLocation").val(result["endLocation"]);
                },
                error: function (xhr, status, error) {
                    console.log(xhr);
                }
            });
        }
    </script>
</body>
</html>
